<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080914">
  <title>You're offline · Crowdwide</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #080914; color: #f6f6fa; font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; text-align: center; }
    img { width: 88px; height: 88px; margin-bottom: 18px; }
    h1 { margin: 0 0 10px; font-size: 1.6rem; line-height: 1.2; }
    p { margin: 0 0 22px; color: #bdc0d4; line-height: 1.55; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: linear-gradient(110deg, #5068ff, #893cff); color: #fff; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #aab6ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/Crowdwide_logo_192.png" alt="" width="88" height="88">
    <h1>You're offline</h1>
    <p>Crowdwide needs a connection to load your feed and messages. Check your network, then try again.</p>
    <a href="/dashboard">Try again</a>
  </main>
</body>
</html>
